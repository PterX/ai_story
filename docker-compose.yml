services:

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine


  # Django后端
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn --chdir /app/backend config.wsgi:application --bind 0.0.0.0:8010 -k gevent --workers 2 --worker-connections 1000 --timeout 3600
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_HOST=redis
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
    depends_on:
      - redis

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app/backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app/backend
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_HOST=redis
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
    depends_on:
      - redis

  # 前端静态入口: linknow at /, ai_story admin at /admin
  frontend:
    build:
      context: ..
      dockerfile: ai_story/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
